# docker-compose.yml
# 使用前确保当前目录存在 config.json / git_sync.sh（仓库自带，改好令牌即可）
# ip.txt 若不存在请先执行：touch ip.txt
#
# 镜像名不写死：通过环境变量 CFNB_IMAGE 注入（支持 .env 文件，参考 .env.example）
#   - 修改同目录下 .env:  CFNB_IMAGE=ghcr.io/<你的用户名>/cfnb:latest
#   - 或启动时临时指定:   CFNB_IMAGE=xxx docker compose up -d
#   - 未设置时回退为本地构建（build: .）
#
# 快速启动：docker compose up -d
# 查看日志：docker compose logs -f

services:
  cfnb:
    # 未设置 CFNB_IMAGE 时，使用下方 build 本地构建并打标签 cfnb:local
    image: ${CFNB_IMAGE:-cfnb:local}
    build: .
    container_name: cfnb
    restart: unless-stopped
    environment:
      - RUN_INTERVAL=300              # 每 5 分钟运行一次；0 = 只运行一次
      - TZ=Asia/Shanghai
      # - GIT_REPO=<你的用户名>/<仓库名>   # 可选：为容器内 git 初始化 origin 远程
    volumes:
      - ./config.json:/app/config.json          # 主配置（含 Cloudflare/WxPusher 令牌）
      - ./git_sync.sh:/app/git_sync.sh         # 推送脚本（含 GitHub Token，覆盖镜像内默认文件）
      - ./ip.txt:/app/ip.txt                    # 优选结果持久化
      # - ./valid_tokens.txt:/app/valid_tokens.txt     # 启用 IP 地区校准时取消注释
      # - ./ipinfo_cache.txt:/app/ipinfo_cache.txt     # 启用 IP 地区校准时取消注释
