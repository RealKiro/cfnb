name: Docker CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ============ 阶段一：构建 + 冒烟测试（PR 也会执行，不推送） ============
  test:
    name: 构建测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（仅加载，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cfnb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试（依赖导入 + 语法检查）
        run: |
          docker run --rm cfnb:test python -c "import requests, aiohttp; print('依赖导入 OK')"
          docker run --rm cfnb:test python -m py_compile main.py && echo "语法检查 OK"

  # ============ 阶段二：多架构构建并推送 GHCR（PR 时跳过） ============
  push:
    name: 推送到 GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成小写镜像名（GHCR 要求全小写）
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU（arm64 交叉构建）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
